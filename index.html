<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Währungsumrechner</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png"> 
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Fehler:', err));
      });
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
 
        /* Fix für PWA-Ränder und den blauen Balken */
        html {background-color: #000000 !important;
              overscroll-behavior-y: none;
        }
        
    body { font-family: 'Inter', sans-serif; background-color: #D2FF00; }
    .shadow-3xl { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
    /* Versteckt den Standard-Pfeil bei datalist in manchen Browsern */
    input::-webkit-calendar-picker-indicator { opacity: 0; }
  </style>
</head>
<body class="flex items-start justify-center min-h-screen p-4 pt-4">
  <div class="bg-white p-8 rounded-3xl shadow-3xl w-full max-w-lg border border-gray-100">
    <h1 class="text-3xl font-bold text-center text-slate-800 mb-8">Währung</h1>
    
    <div class="mb-6">
      <label for="amount" class="block text-sm font-medium text-gray-700 mb-1">Betrag</label>
      <input type="text" id="amount" placeholder="Geben Sie den Betrag ein"
             class="mt-1 block w-full px-4 py-3 border-2 border-gray-300 rounded-xl shadow-inner placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
    </div>

    <div class="flex flex-col md:flex-row items-center justify-between space-y-6 md:space-y-0 md:space-x-4 mb-8">
      <div class="relative w-full md:w-5/12">
        <label for="from-input" class="block text-sm font-medium text-gray-700 mb-1">Von</label>
        <input list="currency-list" id="from-input" placeholder="Suchen..." 
               class="mt-1 block w-full px-4 py-3 border-2 border-gray-300 rounded-xl shadow-inner focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white pr-10">
        <div class="absolute inset-y-0 right-0 flex items-center pr-3 pt-6 pointer-events-none">
          <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </div>
      </div>
      
      <button id="swap-btn" class="p-3 rounded-full bg-blue-500 hover:bg-blue-600 shadow-lg">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
        </svg>
      </button>

      <div class="relative w-full md:w-5/12">
        <label for="to-input" class="block text-sm font-medium text-gray-700 mb-1">Zu</label>
        <input list="currency-list" id="to-input" placeholder="Suchen..."
               class="mt-1 block w-full px-4 py-3 border-2 border-gray-300 rounded-xl shadow-inner focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white pr-10">
        <div class="absolute inset-y-0 right-0 flex items-center pr-3 pt-6 pointer-events-none">
          <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </div>
      </div>
    </div>

    <datalist id="currency-list"></datalist>

    <div id="result" class="mt-8 text-center text-xl font-bold text-gray-800 min-h-[4rem] bg-gray-50 p-4 rounded-xl border border-gray-200 shadow-sm">&nbsp;</div>
  </div>

  <script>
    const amountInput = document.getElementById('amount');
    const fromInput = document.getElementById('from-input');
    const toInput = document.getElementById('to-input');
    const currencyList = document.getElementById('currency-list');
    const swapBtn = document.getElementById('swap-btn');
    const resultDiv = document.getElementById('result');

    function debounce(func, delay) {
      let timeout;
      return function(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), delay);
      };
    }

    function formatNumber(number) {
        return new Intl.NumberFormat('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(number);
    }

    function handleInput(e) {
      let cursorPosition = e.target.selectionStart;
      let originalValue = e.target.value;
      let cleanValue = originalValue.replace(/[^0-9,]/g, '');
      const parts = cleanValue.split(',');
      if (parts.length > 2) cleanValue = parts[0] + ',' + parts.slice(1).join('');
      let [integerPart, decimalPart] = cleanValue.split(',');
      if (integerPart) { integerPart = parseInt(integerPart).toLocaleString('de-DE'); }
      let newValue = integerPart !== undefined ? integerPart : '';
      if (cleanValue.includes(',')) newValue += ',' + (decimalPart || '');
      e.target.value = newValue;
      if (originalValue !== newValue) { cursorPosition = cursorPosition + (newValue.length - originalValue.length); }
      e.target.setSelectionRange(cursorPosition, cursorPosition);
      debouncedConvert();
    }

    async function populateCurrencyDropdowns() {
      try {
        const response = await fetch('https://open.er-api.com/v6/latest/EUR');
        const data = await response.json();
        if (data.result === 'success') {
          const currencies = Object.keys(data.rates).sort();
          const namesResponse = await fetch('https://openexchangerates.org/api/currencies.json');
          const namesData = await namesResponse.json();
          
          currencies.forEach(currency => {
            const fullName = namesData[currency] || currency;
            const option = document.createElement('option');
            option.value = `${currency} - ${fullName}`;
            currencyList.appendChild(option);
          });
          
          fromInput.value = localStorage.getItem('fromCurrency') || 'USD - United States Dollar';
          toInput.value = localStorage.getItem('toCurrency') || 'EUR - Euro';
        }
      } catch (error) {
        resultDiv.textContent = 'Fehler beim Laden der Währungen.';
        resultDiv.classList.add('text-red-500');
      }
    }

    async function convertCurrency() {
      const rawValue = amountInput.value.replace(/\./g, '').replace(',', '.');
      const amount = parseFloat(rawValue);
      
      // Extrahiere nur den ISO-Code (z.B. "USD") aus dem Suchfeld
      const fromCurrency = fromInput.value.split(' - ')[0];
      const toCurrency = toInput.value.split(' - ')[0];
      
      localStorage.setItem('fromCurrency', fromInput.value);
      localStorage.setItem('toCurrency', toInput.value);
      localStorage.setItem('lastAmount', amountInput.value);

      if (isNaN(amount) || amount <= 0) {
        resultDiv.textContent = 'Bitte geben Sie einen gültigen Betrag ein.';
        resultDiv.classList.add('text-red-500');
        return;
      }
      
      try {
        resultDiv.classList.remove('text-red-500');
        const response = await fetch(`https://open.er-api.com/v6/latest/${fromCurrency}`);
        const data = await response.json();
        if (data.result === 'success' && data.rates[toCurrency]) {
          const convertedAmount = amount * data.rates[toCurrency];
          resultDiv.innerHTML = `${amountInput.value} ${fromCurrency}<br>=<br>${formatNumber(convertedAmount)} ${toCurrency}`;
        }
      } catch (error) {
        resultDiv.textContent = 'Fehler beim Abrufen der Kurse.';
        resultDiv.classList.add('text-red-500');
      }
    }

    const debouncedConvert = debounce(convertCurrency, 500);

    window.onload = () => {
        populateCurrencyDropdowns().then(() => {
            const last = localStorage.getItem('lastAmount');
            if (last) { amountInput.value = last; }
            convertCurrency(); 
        });
        amountInput.addEventListener('input', handleInput);
        fromInput.addEventListener('change', convertCurrency);
        toInput.addEventListener('change', convertCurrency);
        swapBtn.addEventListener('click', () => {
            const temp = fromInput.value;
            fromInput.value = toInput.value;
            toInput.value = temp;
            convertCurrency();
        });
    };
  </script>
</body>
</html>
